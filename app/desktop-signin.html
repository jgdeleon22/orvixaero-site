<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Signed in · Orvix Aero</title>
<!-- The Windows app's Google sign-in ends here, in the pilot's browser:
     hand the one-time code to the app (orvixaero://) and say the tab can
     be closed. Nothing is stored or sent from this page. -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06101C; color: #F2F6FA;
         font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .card { max-width: 380px; margin: 16px; padding: 32px 28px; text-align: center; border-radius: 18px;
          background: rgba(15,29,46,.86); border: 1px solid rgba(157,178,197,.16); }
  .mark { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center;
          background: rgba(76,195,138,.14); border: 1px solid rgba(76,195,138,.4); font-size: 28px; color: #4CC38A; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: #9DB2C5; }
  a { color: #F76E19; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main class="card">
  <div class="mark">✓</div>
  <h1 id="title">You're signed in</h1>
  <p id="text">Orvix Aero is opening. You can close this tab.</p>
  <a id="open" href="#">Open Orvix Aero</a>
</main>
<script>
  (function () {
    var q = location.search;
    var target = 'orvixaero://auth-callback' + q + location.hash;
    document.getElementById('open').href = target;
    if (!/[?&](code|error)=/.test(q)) {
      document.getElementById('title').textContent = 'Nothing to do here';
      document.getElementById('text').textContent = 'Sign in from the Orvix Aero app for Windows.';
      return;
    }
    if (/[?&]error=/.test(q)) {
      document.getElementById('title').textContent = 'Sign-in didn’t finish';
      document.getElementById('text').textContent = 'Go back to Orvix Aero and try again.';
    }
    location.href = target;
    setTimeout(function () { window.close(); }, 1500);
  })();
</script>
</body>
</html>
