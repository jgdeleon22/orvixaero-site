<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Orvix Aero</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<script>
  var p = location.pathname;
  // Sign-in links (Google, email) come back with ?code=…: keep it in the
  // address so the app can finish signing in.
  if (p.indexOf('/app/auth-callback') === 0) location.replace('/app/' + location.search + location.hash);
  // ID.me military verification comes back with ?code=…&state=…, renamed so
  // the sign-in client doesn't mistake it for a Supabase sign-in code.
  else if (p.indexOf('/app/idme-callback') === 0) {
    var q = new URLSearchParams(location.search), out = new URLSearchParams();
    ['code', 'state', 'error'].forEach(function (k) { if (q.get(k)) out.set('idme_' + k, q.get(k)); });
    location.replace('/app/?' + out.toString());
  }
  else if (p.indexOf('/app/') === 0 && p.length > 5) location.replace('/app/?go=' + encodeURIComponent(p.slice(4) + location.search));
</script>
