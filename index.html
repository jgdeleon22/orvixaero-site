<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06101C">
<title>Orvix Aero: coming soon</title>
<meta name="description" content="Orvix Aero, the app for pilots, is coming soon. Join the waitlist and we’ll email you at launch.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Orvix Aero">
<meta property="og:title" content="Orvix Aero: coming soon">
<meta property="og:description" content="The app for pilots is almost ready. Join the waitlist.">
<meta property="og:image" content="https://orvixaero.com/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --night: #050D17; --edge: rgba(157, 178, 197, .16); --edge-2: rgba(157, 178, 197, .28); --ink: #F2F6FA; --ink-2: #A3B6C8; --ink-3: #6F879B; --orange: #F76E19; --orange-2: #FF8A3D; --green: #2DB46E;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif; --text: "Barlow", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; display: flex; flex-direction: column; background: radial-gradient(900px 500px at 75% 10%, rgba(247, 110, 25, .12), transparent 65%), radial-gradient(700px 500px at 10% 100%, rgba(127, 180, 230, .08), transparent 65%), var(--night); color: var(--ink); font-family: var(--text); font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 3px solid var(--orange-2); outline-offset: 3px; border-radius: 6px; }
  main { flex: 1; display: grid; place-items: center; padding: 40px 20px; }
  .card { width: 100%; max-width: 520px; text-align: center; }
  .logo { width: 150px; height: auto; margin: 0 auto 28px; display: block; }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(44px, 9vw, 72px); line-height: .98; margin: 0; letter-spacing: -.01em; }
  .lede { color: var(--ink-2); margin: 18px auto 0; max-width: 28em; }
  form { margin: 0; }
  .join { display: flex; gap: 10px; margin-top: 32px; }
  input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: rgba(170, 196, 220, .06); border: 1px solid var(--edge-2); border-radius: 14px; padding: 14px 16px; }
  input::placeholder { color: var(--ink-3); }
  input:focus { border-color: var(--orange); outline: none; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--orange); border: 0; border-radius: 14px; padding: 14px 22px; cursor: pointer; white-space: nowrap; box-shadow: 0 10px 30px rgba(247, 110, 25, .28); }
  button:hover { background: var(--orange-2); }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 24px; margin-top: 10px; font-size: 15px; color: var(--ink-2); }
  .msg.ok { color: var(--green); } .msg.err { color: #F2817A; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .team-link { margin-top: 36px; background: none; box-shadow: none; color: var(--ink-3); font-weight: 500; font-size: 15px; padding: 6px; text-decoration: underline; text-underline-offset: 3px; }
  .team-link:hover { background: none; color: var(--ink); }
  .team { display: none; margin-top: 20px; padding: 22px; border: 1px solid var(--edge); border-radius: 18px; background: rgba(170, 196, 220, .04); text-align: left; }
  .team.on { display: grid; gap: 10px; }
  .team b { font-family: var(--display); font-weight: 600; font-size: 24px; }
  .team .fine { color: var(--ink-3); font-size: 14px; }
  .team .fine a { color: var(--ink-2); }
  footer { padding: 22px 20px 28px; display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; font-size: 14px; color: var(--ink-3); }
  footer a { color: var(--ink-2); text-decoration: none; }
  footer a:hover { color: var(--ink); }
  .loading { display: none; position: fixed; inset: 0; place-items: center; background: var(--night); color: var(--ink-2); font-size: 16px; z-index: 5; }
  .loading.on { display: grid; }
  @media (max-width: 480px) { .join { flex-direction: column; } }
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="logo.png" alt="Orvix Aero" width="300" height="200">
    <h1>Coming soon.</h1>
    <p class="lede">The app for pilots is almost ready. Join the waitlist and we’ll email you when it launches.</p>
    <form class="join" id="join" novalidate>
      <label class="hp" aria-hidden="true">Company <input name="company" tabindex="-1" autocomplete="off"></label>
      <label for="join-email" class="hp">Email</label>
      <input id="join-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
      <button type="submit">Join the waitlist</button>
    </form>
    <p class="msg" id="join-msg" role="status" aria-live="polite"></p>

    <button class="team-link" id="team-toggle" type="button" aria-expanded="false" aria-controls="team">Team sign in</button>
    <form class="team" id="team">
      <b>Team preview</b>
      <label for="t-email" class="hp">Email</label>
      <input id="t-email" type="email" autocomplete="username" placeholder="Email" required>
      <label for="t-pw" class="hp">Password</label>
      <input id="t-pw" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit" id="t-btn">Sign in</button>
      <p class="msg" id="t-msg" role="status" aria-live="polite"></p>
      <p class="fine">Use your Orvix Central Hub account. Forgot your password? Reset it at <a href="https://orvixcentralhub.com/">orvixcentralhub.com</a>.</p>
    </form>
  </div>
</main>
<footer>
  <a href="mailto:info@orvixaero.com">info@orvixaero.com</a>
  <a href="/app/">Members log in</a>
  <a href="/privacy.html">Privacy Policy</a>
  <a href="/terms.html">Terms of Use</a>
</footer>
<div class="loading" id="loading">Loading the preview…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
  const SUPABASE_URL = "https://uxnjglagrrprnsliyaed.supabase.co";
  const SUPABASE_KEY = "sb_publishable_8vrxn8kJD8_lXdJ-a6_eqg_EtHNC4B8";
  const $ = (id) => document.getElementById(id);
  const say = (el, text, kind) => { el.textContent = text; el.className = 'msg' + (kind ? ' ' + kind : ''); };

  // Waitlist: saves the email (insert-only table, no reads).
  $('join').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.currentTarget, msg = $('join-msg'), email = f.email.value.trim().toLowerCase();
    if (f.company.value) return say(msg, "You're on the list. We'll email you at launch.", 'ok');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return say(msg, 'Enter a valid email address, like you@example.com.', 'err');
    const btn = f.querySelector('button'); btn.disabled = true; say(msg, 'Adding you…');
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/waitlist', { method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ email, source: 'orvixaero.com' }) });
      if (res.ok || res.status === 409) { f.reset(); say(msg, res.status === 409 ? "You're already on the list. We'll email you at launch." : "You're on the list. We'll email you at launch.", 'ok'); }
      else say(msg, "That didn't go through. Try again, or email info@orvixaero.com.", 'err');
    } catch { say(msg, "Couldn't connect. Check your connection and try again.", 'err'); }
    finally { btn.disabled = false; }
  });

  // Team preview: Central Hub admins sign in and get the real page from the
  // site-gate function. Its own session (separate from the web app's).
  const sb = window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'orvix-site-auth', persistSession: true } }) : null;
  $('team-toggle').addEventListener('click', () => {
    const on = $('team').classList.toggle('on');
    $('team-toggle').setAttribute('aria-expanded', String(on));
    if (on) $('t-email').focus();
  });
  async function openPreview(quiet) {
    if (!sb) return;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;
    $('loading').classList.add('on');
    try {
      const { data, error } = await sb.functions.invoke('site-gate', { body: { action: 'get' } });
      if (error || !data?.html) throw new Error(data?.error || 'This account doesn’t have early access.');
      const bar = '<div style="position:fixed;z-index:99;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:8px 10px 8px 16px;border-radius:999px;background:rgba(5,13,23,.9);border:1px solid rgba(157,178,197,.28);font:500 14px Barlow,system-ui,sans-serif;color:#A3B6C8;backdrop-filter:blur(10px)">Team preview · not public yet<button onclick="localStorage.removeItem(\'orvix-site-auth\');location.reload()" style="font:600 13px Barlow,system-ui,sans-serif;color:#F2F6FA;background:transparent;border:1px solid rgba(157,178,197,.35);border-radius:999px;padding:5px 12px;cursor:pointer">Sign out</button></div>';
      const html = data.html.replace('</body>', bar + '</body>');
      // Swap the page only once this one has finished loading (a document.open()
      // while the page is still being read is ignored by the browser).
      if (document.readyState !== 'complete') await new Promise((r) => addEventListener('load', r, { once: true }));
      document.open(); document.write(html); document.close();
    } catch (err) {
      $('loading').classList.remove('on');
      await sb.auth.signOut();
      if (!quiet) { $('team').classList.add('on'); say($('t-msg'), err.message, 'err'); }
    }
  }
  $('team').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!sb) return say($('t-msg'), 'Couldn’t load sign-in. Refresh and try again.', 'err');
    const btn = $('t-btn'); btn.disabled = true; say($('t-msg'), 'Signing in…');
    const { error } = await sb.auth.signInWithPassword({ email: $('t-email').value.trim(), password: $('t-pw').value });
    btn.disabled = false;
    if (error) return say($('t-msg'), error.message, 'err');
    $('t-pw').value = '';
    say($('t-msg'), '');
    openPreview(false);
  });
  openPreview(true);
})();
</script>
<script>try{if(!/^(localhost|127\.)/.test(location.hostname)){var q=new URLSearchParams(location.search);fetch("https://uxnjglagrrprnsliyaed.supabase.co/functions/v1/site-hit",{method:"POST",keepalive:true,body:JSON.stringify({path:location.pathname,ref:document.referrer,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,utm:{source:q.get("utm_source")||"",medium:q.get("utm_medium")||"",campaign:q.get("utm_campaign")||""}})}).catch(function(){})}}catch(e){}</script>
</body>
</html>
