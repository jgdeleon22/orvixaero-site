<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instructor signature — Orvix Aero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0A3341; --ink-2: #4E6670; --rule: #DCE3E7; --paper: #F6F7F8; --orange-ink: #B4500F; --focus: #F76E19; --ok: #17845A; --bad: #B3261E; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Barlow", system-ui, sans-serif; font-size: 17px; line-height: 1.5; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 20px 64px; }
  .brand img { height: 48px; width: auto; display: block; }
  h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: clamp(30px, 6vw, 42px); line-height: 1.05; margin: 28px 0 6px; }
  h2 { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 22px; margin: 28px 0 8px; }
  .lead { color: var(--ink-2); margin: 0 0 18px; }
  .card { background: #fff; border: 1px solid var(--rule); border-radius: 14px; padding: 16px 18px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--ink-2); } dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .body { white-space: pre-wrap; }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  input[type=text], input[type=date] { width: 100%; font: 17px "Barlow", system-ui, sans-serif; padding: 10px 12px; border: 1px solid #B9C6CD; border-radius: 10px; background: #fff; color: var(--ink); }
  input:focus-visible, button:focus-visible, canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  canvas { display: block; width: 100%; height: 170px; background: #fff; border: 1px dashed #93A6B0; border-radius: 10px; touch-action: none; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 14px; color: var(--ink-2); }
  .link { background: none; border: 0; color: var(--orange-ink); font: 600 15px "Barlow", system-ui, sans-serif; cursor: pointer; padding: 4px 0; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin-top: 18px; }
  .check input { margin-top: 5px; width: 18px; height: 18px; }
  .primary { margin-top: 20px; width: 100%; font: 700 18px "Barlow", system-ui, sans-serif; color: #fff; background: var(--ink); border: 0; border-radius: 12px; padding: 14px; cursor: pointer; }
  .primary[disabled] { opacity: .6; cursor: default; }
  .error { color: var(--bad); font-weight: 600; margin-top: 12px; }
  .done { color: var(--ok); }
  .small { color: var(--ink-2); font-size: 14px; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/"><img src="logo.png" alt="Orvix Aero"></a>
  <div id="app"><p>Loading…</p></div>
</div>
<script>
(function () {
  var API = 'https://uxnjglagrrprnsliyaed.supabase.co/functions/v1/share-link';
  var t = new URLSearchParams(location.search).get('t') || location.hash.slice(1);
  var app = document.getElementById('app');
  function el(tag, attrs, text) { var e = document.createElement(tag); for (var k in (attrs || {})) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }
  function message(title, body, cls) { app.innerHTML = ''; app.appendChild(el('h1', cls ? { class: cls } : null, title)); app.appendChild(el('p', { class: 'lead' }, body)); }
  if (!t) return message('Can’t open this link', 'The link is missing its code. Ask the pilot to send it again.');

  fetch(API + '?t=' + encodeURIComponent(t))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (x) {
      if (!x.ok || x.j.kind !== 'sign') return message('Can’t open this link', x.j.error || 'This link doesn’t work.');
      if (x.j.signed) return message('Already signed', 'Signed by ' + x.j.signed.name + ' (' + x.j.signed.cert + ') on ' + new Date(x.j.signed.at).toLocaleDateString() + '. Nothing else to do.', 'done');
      render(x.j);
    })
    .catch(function () { message('Couldn’t load this page', 'Check your connection and try again.'); });

  function render(d) {
    app.innerHTML = '';
    var isFlight = d.what === 'flight';
    app.appendChild(el('h1', null, isFlight ? 'Sign a flight' : 'Sign an endorsement'));
    app.appendChild(el('p', { class: 'lead' }, 'A pilot asked you to sign this in their Orvix Aero logbook. Check it, then sign below. You don’t need an account.'));
    var card = el('div', { class: 'card' });
    if (isFlight) {
      var s = d.summary || {};
      var dl = el('dl');
      [['Date', s.date], ['Route', s.route], ['Aircraft', s.aircraft], ['Total', s.total], ['Dual received', s.dual], ['PIC', s.pic], ['Night', s.night], ['Cross-country', s.xc], ['Actual instrument', s.actual], ['Simulated instrument', s.hood], ['Landings', s.landings], ['Remarks', s.remarks], ['Pilot', s.pilot]]
        .forEach(function (p) { if (p[1] != null && p[1] !== '' && p[1] !== '0.0' && p[1] !== 0) { dl.appendChild(el('dt', null, p[0])); dl.appendChild(el('dd', null, String(p[1]))); } });
      card.appendChild(dl);
    } else {
      card.appendChild(el('h2', { style: 'margin-top:0' }, d.endorsement.title));
      card.appendChild(el('div', { class: 'body' }, d.endorsement.body));
      if (d.summary && d.summary.pilot) card.appendChild(el('p', { class: 'small' }, 'For: ' + d.summary.pilot));
    }
    app.appendChild(card);

    app.appendChild(el('h2', null, 'Your details'));
    var f = el('form', { novalidate: '' });
    f.appendChild(el('label', { for: 'name' }, 'Your name'));
    var name = el('input', { id: 'name', type: 'text', autocomplete: 'name', maxlength: '80' }); f.appendChild(name);
    f.appendChild(el('label', { for: 'cert' }, 'Certificate number'));
    var cert = el('input', { id: 'cert', type: 'text', autocomplete: 'off', maxlength: '30' }); f.appendChild(cert);
    f.appendChild(el('label', { for: 'exp' }, 'Certificate expiration (if it has one)'));
    var exp = el('input', { id: 'exp', type: 'date' }); f.appendChild(exp);
    f.appendChild(el('label', { for: 'pad' }, 'Signature'));
    var pad = el('canvas', { id: 'pad', 'aria-label': 'Draw your signature here', tabindex: '0' }); f.appendChild(pad);
    var row = el('div', { class: 'row' });
    row.appendChild(el('span', null, 'Sign with your finger or mouse'));
    var clear = el('button', { type: 'button', class: 'link' }, 'Clear'); row.appendChild(clear);
    f.appendChild(row);
    var chkL = el('label', { class: 'check' });
    var chk = el('input', { type: 'checkbox' });
    chkL.appendChild(chk);
    chkL.appendChild(el('span', null, isFlight ? 'I gave this instruction and the entry is correct.' : 'I give this endorsement and the text above is correct.'));
    f.appendChild(chkL);
    var err = el('p', { class: 'error', role: 'alert' }); f.appendChild(err);
    var go = el('button', { type: 'submit', class: 'primary' }, 'Sign'); f.appendChild(go);
    app.appendChild(f);
    app.appendChild(el('p', { class: 'small' }, 'Your name, certificate number and signature are saved with this entry in the pilot’s logbook only.'));

    // Signature: strokes of points scaled to 0–1000, like the app.
    var strokes = [], cur = null, ctx = pad.getContext('2d');
    function size() { var r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; pad.width = r.width * dpr; pad.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(); }
    function pt(e) { var r = pad.getBoundingClientRect(); return [Math.max(0, Math.min(1000, Math.round((e.clientX - r.left) / r.width * 1000))), Math.max(0, Math.min(1000, Math.round((e.clientY - r.top) / r.height * 1000)))]; }
    function draw() {
      var r = pad.getBoundingClientRect();
      ctx.clearRect(0, 0, r.width, r.height); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0A3341';
      strokes.forEach(function (s) { ctx.beginPath(); s.forEach(function (p, i) { var x = p[0] / 1000 * r.width, y = p[1] / 1000 * r.height; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); if (s.length === 1) ctx.lineTo(s[0][0] / 1000 * r.width + .1, s[0][1] / 1000 * r.height); ctx.stroke(); });
    }
    pad.addEventListener('pointerdown', function (e) { e.preventDefault(); pad.setPointerCapture(e.pointerId); cur = [pt(e)]; strokes.push(cur); draw(); });
    pad.addEventListener('pointermove', function (e) { if (!cur) return; var p = pt(e), l = cur[cur.length - 1]; if (Math.abs(p[0] - l[0]) + Math.abs(p[1] - l[1]) >= 4) { cur.push(p); draw(); } });
    ['pointerup', 'pointercancel'].forEach(function (n) { pad.addEventListener(n, function () { cur = null; }); });
    clear.onclick = function () { strokes = []; draw(); };
    window.addEventListener('resize', size); size();

    f.onsubmit = function (e) {
      e.preventDefault(); err.textContent = '';
      var n = strokes.reduce(function (a, s) { return a + s.length; }, 0);
      if (name.value.trim().length < 2) return (err.textContent = 'Enter your name.');
      if (cert.value.trim().length < 3) return (err.textContent = 'Enter your certificate number.');
      if (n < 8) return (err.textContent = 'Sign in the box first.');
      if (!chk.checked) return (err.textContent = 'Check the box to confirm.');
      go.disabled = true; go.textContent = 'Signing…';
      fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: t, name: name.value, cert: cert.value, certExpires: exp.value, strokes: strokes }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (x) {
          if (!x.ok) { go.disabled = false; go.textContent = 'Sign'; err.textContent = x.j.error || 'Couldn’t sign. Try again.'; return; }
          message('Signed. Thank you!', 'It’s saved in the pilot’s logbook. You can close this page.', 'done');
        })
        .catch(function () { go.disabled = false; go.textContent = 'Sign'; err.textContent = 'Couldn’t reach the server. Check your connection and try again.'; });
    };
  }
})();
</script>
</body>
</html>
